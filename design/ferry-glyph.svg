  <g id="foreground" transform="translate(0,22)">
    <g id="glyph" fill="#FFFFFF">
      <polygon id="page" points="392,232 568,232 632,296 632,480 392,480"/>
      <polygon id="fold" points="568,232 568,296 632,296" fill="#9CC6FF"/>
      <polygon id="hull" points="292,498 732,498 642,632 382,632"/>
