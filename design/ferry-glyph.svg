    <path id="wave" d="M 262 702 C 304 670 345 670 387 702 S 470 734 512 702 S 595 670 637 702 S 720 734 762 702" fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round"/>
  </g>
</svg>
