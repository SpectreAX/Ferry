<!-- Ferry app icon master: "C2 — Liquid Glass", Ocean palette, one wave ("Ferry App Icon" Claude Design canvas,
     page "v2 Liquid Glass"). 1024 canvas on the macOS icon grid (824×824 body, radius 185).
     Groups: background (gradient, sheen, rim), glyph (frosted-glass page + fold + hull), waves. -->
<svg xmlns="http://www.w3.org/2000/svg" id="ferry-icon" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="ferry-bg" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4AA3FF"/>
      <stop offset="1" stop-color="#0A4BD1"/>
    </linearGradient>
    <radialGradient id="ferry-sheen" cx="512" cy="110" r="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ferry-glass" x1="0" y1="232" x2="0" y2="632" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.97"/>
      <stop offset="1" stop-color="#D3E6FF" stop-opacity="0.80"/>
    </linearGradient>
    <linearGradient id="ferry-rim" x1="0" y1="232" x2="0" y2="632" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.35"/>
    </linearGradient>
    <!-- Lifts the glass off the background. -->
    <filter id="ferry-lift" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="16" result="lift"/>
      <feFlood flood-color="#06246B" flood-opacity="0.45"/>
      <feComposite in2="lift" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Icon drop shadow: drop-shadow(0 12.29px 22.53px rgba(0,0,0,0.22)) at 1024 px, as on the canvas. -->
    <filter id="ferry-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="11.26"/>
      <feOffset dy="12.29" result="shadow"/>
      <feFlood flood-color="#000000" flood-opacity="0.22"/>
      <feComposite in2="shadow" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g id="icon" filter="url(#ferry-shadow)">
    <g id="background">
      <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#ferry-bg)"/>
      <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#ferry-sheen)"/>
      <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="3"/>
    </g>
    <!-- Boat and wave moved down 22 px so the one-wave composition is centered (content spans 254–771). -->
    <g id="foreground" transform="translate(0,22)">
    <g id="glyph" filter="url(#ferry-lift)">
      <polygon id="page" points="392,232 568,232 632,296 632,480 392,480" fill="url(#ferry-glass)" stroke="url(#ferry-rim)" stroke-width="5" stroke-linejoin="round"/>
      <polygon id="fold" points="568,232 568,296 632,296" fill="#9CC6FF" fill-opacity="0.95"/>
      <polygon id="hull" points="292,498 732,498 642,632 382,632" fill="url(#ferry-glass)" stroke="url(#ferry-rim)" stroke-width="5" stroke-linejoin="round"/>
    </g>
    <g id="waves">
      <path id="wave" d="M 262 702 C 304 670 345 670 387 702 S 470 734 512 702 S 595 670 637 702 S 720 734 762 702" fill="none" stroke="#FFFFFF" stroke-opacity="0.95" stroke-width="30" stroke-linecap="round"/>
    </g>
    </g>
  </g>
</svg>
