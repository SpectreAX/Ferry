name: Ferry
options:
  bundleIdPrefix: dev.spectreax
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: Y5HEVNEK2Q
targets:
  Ferry:
    type: application
    platform: macOS
    sources:
      - path: Ferry
    info:
      path: Ferry/Info.plist
      properties:
        CFBundleDisplayName: Ferry
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [net.daringfireball.markdown]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown]
              public.mime-type: [text/markdown]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.spectreax.ferry
        PRODUCT_NAME: Ferry
        MARKETING_VERSION: "1.3.0"
        CURRENT_PROJECT_VERSION: "6"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
  FerryTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: FerryTests
    dependencies:
      - target: Ferry
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.spectreax.ferry.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Ferry.app/Contents/MacOS/Ferry"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Ferry:
    build:
      targets:
        Ferry: all
        FerryTests: [test]
    test:
      targets: [FerryTests]
